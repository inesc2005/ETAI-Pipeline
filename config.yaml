# Pipeline configuration: everything tunable lives here, nothing is hardcoded in src/.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # never a feature; used only for the fairness check
  drop_columns: ["id", "decile_score", "score_text"]  # id and COMPAS's own score, never model inputs

# locked test set: never used to fit, tune or choose anything. Do not change once set.
test_set:
  size: 0.2
  random_state: 42

# stratified k-fold CV on the development set; same random_state = same folds for every run
cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  # reported for every run; fbeta_2 counts recall twice as much as precision
  metrics: ["accuracy", "balanced_accuracy", "precision", "recall", "f1", "fbeta_2", "roc_auc", "average_precision"]
  selection_metric: "roc_auc"   # what tuning maximises and the scoreboard ranks runs by
  n_jobs: 1                     # -1 = all CPU cores

model:
  # dummy | logistic_regression | naive_bayes | decision_tree | random_forest |
  # oblique_random_forest | adaboost | gradient_boosting | hist_gradient_boosting
  type: "gradient_boosting"
  params:                       # default (untuned) hyperparameters
    random_state: 42
  # Other models' params, to swap in (dummy: run it with tuning.enabled: false):
  # dummy:                  {}
  # logistic_regression:    {max_iter: 2000, class_weight: balanced}
  # naive_bayes:            {}
  # decision_tree:          {random_state: 42, class_weight: balanced}
  # random_forest:          {n_estimators: 200, random_state: 42, n_jobs: -1, class_weight: balanced}
  # oblique_random_forest:  {n_estimators: 200, n_components: 10, random_state: 42, n_jobs: -1}
  # adaboost:               {max_depth: 1, n_estimators: 200, learning_rate: 1.0, random_state: 42}
  # hist_gradient_boosting: {random_state: 42, class_weight: balanced}

# Optuna tuning on the development set; the honest score comes from nested CV
tuning:
  enabled: true
  n_trials: 30                  # use ~5 while testing: ensembles take minutes per run
  n_splits: 5                   # inner folds that score each candidate
  random_state: 42
  # keys are Pipeline parameter names; types: int / float (low, high, log) or categorical (choices)
  search_spaces:
    decision_tree:
      model__max_depth: {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}
    logistic_regression:
      model__C: {type: float, low: 0.0001, high: 100, log: true}
    random_forest:              # n_estimators is fixed in params: more trees never overfit
      model__max_depth: {type: int, low: 2, high: 30}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__max_features: {type: categorical, choices: ["sqrt", 0.5, 1.0]}
    oblique_random_forest:
      model__estimator__tree__max_depth: {type: int, low: 2, high: 30}
      model__estimator__tree__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__estimator__project__n_components: {type: int, low: 3, high: 10}
    adaboost:
      model__estimator__max_depth: {type: int, low: 1, high: 8}
      model__n_estimators: {type: int, low: 25, high: 400, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 1.0, log: true}
    gradient_boosting:
      model__n_estimators: {type: int, low: 25, high: 500, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.5, log: true}
      model__max_depth: {type: int, low: 1, high: 6}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__subsample: {type: float, low: 0.5, high: 1.0}
    hist_gradient_boosting:
      model__max_iter: {type: int, low: 25, high: 500, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.5, log: true}
      model__max_leaf_nodes: {type: int, low: 2, high: 63, log: true}
      model__min_samples_leaf: {type: int, low: 5, high: 200, log: true}
      model__l2_regularization: {type: float, low: 0.000001, high: 10.0, log: true}
    naive_bayes:
      model__var_smoothing: {type: float, low: 0.000000000001, high: 0.1, log: true}

output:
  results_dir: "results"            # one full report per run
  scoreboard: "results/runs.csv"    # one row per run; delete it if the data, cleaning or folds change

diagnostics:
  # predictors for the missingness-mechanism test (chi-square + Cramer's V)
  candidate_predictors: ["sex", "race", "age_cat", "c_charge_degree", "score_text"]

  # impossible values -> NaN
  validity_rules:
    age: "18 <= age <= 100"
    decile_score: "1 <= decile_score <= 10"
    juv_fel_count: "juv_fel_count >= 0"
    priors_count: "0 <= priors_count <= 60"

  id_column: "id"                   # repeated ids count as duplicates

  # stand-in tokens for missing data
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", ""]

  # spelling/casing variants -> one label per column
  canonical_maps:
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"

  # redundant columns (multicollinearity check)
  columns_to_drop: ["prior_offenses", "age_in_months", "juvenile_total"]

  # a category must match the bucket of its numeric source; mismatches -> category set to NaN
  bucket_consistency:
    age_cat:
      value_column: "age"
      buckets:
        - {max: 25, label: "Less than 25"}
        - {min: 25, max: 45, label: "25 - 45"}
        - {min: 45, label: "Greater than 45"}
    score_text:
      value_column: "decile_score"
      buckets:
        - {min: 1, max: 5, label: "Low"}
        - {min: 5, max: 8, label: "Medium"}
        - {min: 8, max: 11, label: "High"}

preprocessing:
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  # engineered features (add to numeric_features to use them; tested, none helped -- see README):
  # priors_per_adult_year, has_juvenile_record, priors_bin, felony_with_priors, log_priors
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  mnar_columns: ["priors_count", "c_charge_degree"]   # get a "<col>_was_missing" flag
  numeric_impute_strategy: "median"         # median | mean | knn
  categorical_impute_strategy: "most_frequent"
  scaler: "standard"                        # standard | minmax | robust | none
  random_state: 42                          # target encoder's internal folds
  encoder: "target"                         # onehot | ordinal | count | target
